<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบ Admin - จัดการเลขหนังสือ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v9 (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --secondary: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Login Page */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid var(--danger);
        }

        /* Admin Dashboard */
        .admin-container {
            display: none;
            min-height: 100vh;
        }

        .admin-header {
            background: white;
            padding: 20px 30px;
            box-shadow: 0 2px 10px var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .btn-logout {
            padding: 8px 20px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-logout:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .admin-body {
            display: flex;
            background: #f9fafb;
        }

        .sidebar {
            width: 280px;
            background: white;
            min-height: calc(100vh - 80px);
            box-shadow: 2px 0 10px var(--shadow);
            padding: 30px 0;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            color: #4b5563;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 15px;
            border-left: 3px solid transparent;
        }

        .sidebar-menu a:hover {
            background: #f3f4f6;
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .sidebar-menu a.active {
            background: linear-gradient(90deg, rgba(30, 64, 175, 0.1) 0%, rgba(30, 64, 175, 0.05) 100%);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }

        .sidebar-menu a::before {
            content: "📄";
            margin-right: 12px;
            font-size: 18px;
        }

        .sidebar-menu a[data-system="documents"]::before { content: "📤"; }
        .sidebar-menu a[data-system="circulars"]::before { content: "🔄"; }
        .sidebar-menu a[data-system="memos"]::before { content: "📝"; }
        .sidebar-menu a[data-system="command"]::before { content: "📋"; }
        .sidebar-menu a[data-system="certificate"]::before { content: "🏆"; }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .content-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-card.primary .stat-icon { background: rgba(30, 64, 175, 0.1); }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
        }

        .data-table {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px var(--shadow);
            overflow: hidden;
        }

        .table-container-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--dark);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th {
            padding: 15px 25px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 18px 25px;
            border-bottom: 1px solid var(--border);
            color: #4b5563;
            font-size: 14px;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background: #f3f4f6;
            color: var(--dark);
        }

        .modal-body {
            padding: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .search-box {
            position: relative;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box::after {
            content: "🔍";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .btn-text-mobile {
            display: none;
        }

        .btn-text-desktop {
            display: inline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 15px 20px;
            }

            .admin-header h1 {
                font-size: 18px;
            }

            .user-info span {
                display: none;
            }

            .user-avatar {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            .btn-logout {
                padding: 6px 12px;
                font-size: 12px;
            }

            .admin-body {
                flex-direction: column-reverse;
                padding-bottom: 70px;
            }

            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                min-height: auto;
                height: 70px;
                padding: 0;
                z-index: 100;
                box-shadow: 0 -2px 10px var(--shadow);
                overflow-x: auto;
                overflow-y: hidden;
            }

            .sidebar-menu {
                display: flex;
                height: 100%;
                align-items: center;
                justify-content: space-around;
                margin: 0;
            }

            .sidebar-menu li {
                margin: 0;
                flex: 1;
            }

            .sidebar-menu a {
                flex-direction: column;
                padding: 8px 5px;
                text-align: center;
                border-left: none;
                border-top: 3px solid transparent;
                font-size: 11px;
                height: 100%;
                justify-content: center;
            }

            .sidebar-menu a::before {
                margin-right: 0;
                margin-bottom: 2px;
                font-size: 20px;
            }

            .sidebar-menu a.active {
                background: linear-gradient(180deg, rgba(30, 64, 175, 0.1) 0%, rgba(30, 64, 175, 0.05) 100%);
                border-left: none;
                border-top-color: var(--primary);
            }

            .sidebar-menu a span {
                display: block;
                white-space: nowrap;
                font-size: 10px;
            }

            .main-content {
                padding: 15px;
            }

            .content-header h2 {
                font-size: 22px;
            }

            .content-header p {
                font-size: 13px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-value {
                font-size: 28px;
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .table-header > div {
                flex-direction: column;
                gap: 10px;
            }

            .btn-text-desktop {
                display: none;
            }

            .btn-text-mobile {
                display: inline;
                font-size: 18px;
            }

            .btn {
                min-width: 44px;
            }

            .search-box {
                max-width: 100%;
            }

            /* Make table scrollable horizontally */
            .data-table {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
                font-size: 13px;
            }

            th, td {
                padding: 12px 15px;
                white-space: nowrap;
            }

            .action-buttons {
                flex-direction: column;
                gap: 5px;
            }

            .btn-small {
                width: 80px;
                padding: 5px 10px;
                font-size: 12px;
            }

            /* Modal adjustments */
            .modal-content {
                width: 95%;
                margin: 10px;
            }

            .modal-header {
                padding: 20px;
            }

            .modal-header h3 {
                font-size: 18px;
            }

            .modal-body {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-footer {
                padding: 15px 20px;
            }

            /* Login page mobile */
            .login-box {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .admin-header h1 {
                font-size: 16px;
            }

            .content-header h2 {
                font-size: 20px;
            }

            .stat-value {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <div class="login-header">
                <h1>ระบบ Admin</h1>
                <p>จัดการระบบเลขหนังสือ</p>
            </div>
            <div class="error-message" id="errorMessage">
                ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" placeholder="กรุณากรอกชื่อผู้ใช้" required>
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" placeholder="กรุณากรอกรหัสผ่าน" required>
                </div>
                <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="adminPanel">
        <div class="admin-header">
            <h1>ระบบจัดการเลขหนังสือ</h1>
            <div class="user-info">
                <div class="user-avatar">A</div>
                <span>Admin</span>
                <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>

        <div class="admin-body">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="#" class="active" data-system="documents" onclick="switchSystem('documents', event)"><span>ระบบหนังสือส่ง</span></a></li>
                    <li><a href="#" data-system="circulars" onclick="switchSystem('circulars', event)"><span>ระบบหนังสือเวียน</span></a></li>
                    <li><a href="#" data-system="memos" onclick="switchSystem('memos', event)"><span>ระบบบันทึกข้อความ</span></a></li>
                    <li><a href="#" data-system="command" onclick="switchSystem('command', event)"><span>ระบบคำสั่ง</span></a></li>
                    <li><a href="#" data-system="certificate" onclick="switchSystem('certificate', event)"><span>ระบบเกียรติบัตร</span></a></li>
                </ul>
            </aside>

            <main class="main-content">
                <div class="content-header">
                    <h2 id="systemTitle">ระบบหนังสือส่ง</h2>
                    <p id="systemDesc">จัดการและควบคุมเลขหนังสือส่ง</p>
                </div>

                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card primary">
                        <div class="stat-icon">📊</div>
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">รายการทั้งหมด</div>
                    </div>
                </div>

                <div class="data-table">
                    <div class="table-header">
                        <h3>รายการข้อมูล</h3>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <div class="search-box">
                                <input type="text" id="searchInput" placeholder="ค้นหา..." onkeyup="searchData()">
                            </div>
                            <button class="btn btn-success" onclick="downloadExcel()">
                                <span class="btn-text-desktop">📥 ดาวน์โหลด Excel</span>
                                <span class="btn-text-mobile">📥</span>
                            </button>
                            <button class="btn btn-primary" onclick="openAddModal()">
                                <span class="btn-text-desktop">+ เพิ่มรายการใหม่</span>
                                <span class="btn-text-mobile">+</span>
                            </button>
                        </div>
                    </div>
                    <div class="table-container-wrapper">
                        <div id="tableContainer">
                            <!-- Table will be dynamically loaded here -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">เพิ่มรายการใหม่</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="dataForm">
                    <!-- Common Fields -->
                    <div class="form-group">
                        <label>เรื่อง <span style="color: red;">*</span></label>
                        <input type="text" id="title" required>
                    </div>

                    <!-- Fields for systems with from/to -->
                    <div id="fromToFields" style="display: none;">
                        <div class="form-group">
                            <label>จาก</label>
                            <input type="text" id="from">
                        </div>
                        <div class="form-group">
                            <label>ถึง</label>
                            <input type="text" id="to">
                        </div>
                    </div>

                    <!-- Fields for certificate system -->
                    <div id="certificateFields" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label>ผู้ลงนาม <span style="color: red;">*</span></label>
                                <input type="text" id="signer" required>
                            </div>
                            <div class="form-group">
                                <label>จำนวน <span style="color: red;">*</span></label>
                                <input type="number" id="quantity" min="1" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ผู้ขอ <span style="color: red;">*</span></label>
                        <input type="text" id="requester" required>
                    </div>
                    
                    <!-- Date field (only shown when editing) - ไว้ก่อนหมายเหตุ -->
                    <div class="form-group" id="dateFieldGroup" style="display: none;">
                        <label>วันที่สร้างเอกสาร</label>
                        <input type="datetime-local" id="docTimestamp">
                    </div>

                    <div class="form-group">
                        <label>หมายเหตุ</label>
                        <textarea id="notes"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()" style="background: #e5e7eb; color: #374151;">ยกเลิก</button>
                <button class="btn btn-primary" onclick="saveData()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCKv1S84RJyK8AzZwd-UwkmO4XxahcwRos",
            authDomain: "e-document-ed317.firebaseapp.com",
            projectId: "e-document-ed317",
            storageBucket: "e-document-ed317.firebasestorage.app",
            messagingSenderId: "920521182684",
            appId: "1:920521182684:web:4f54681f2367a44e5ed319",
            measurementId: "G-M3X6NEF5XY"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Authentication
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'saharaj_12345';

        // Data Storage
        let currentSystem = 'documents';
        let editingId = null;
        let currentData = [];
        let unsubscribe = null; // For Firestore listener

        // System Configuration with Firestore collection names
        const systemConfig = {
            documents: {
                title: 'ระบบหนังสือส่ง',
                desc: 'จัดการและควบคุมเลขหนังสือส่ง',
                icon: '📤',
                collection: 'documents'
            },
            circulars: {
                title: 'ระบบหนังสือเวียน',
                desc: 'จัดการและควบคุมเลขหนังสือเวียน',
                icon: '🔄',
                collection: 'document_v'
            },
            memos: {
                title: 'ระบบบันทึกข้อความ',
                desc: 'จัดการและควบคุมเลขบันทึกข้อความ',
                icon: '📝',
                collection: 'memos'
            },
            command: {
                title: 'ระบบคำสั่ง',
                desc: 'จัดการและควบคุมเลขคำสั่ง',
                icon: '📋',
                collection: 'command'
            },
            certificate: {
                title: 'ระบบเกียรติบัตร',
                desc: 'จัดการและควบคุมเลขเกียรติบัตร',
                icon: '🏆',
                collection: 'certificate'
            }
        };

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadData();
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('errorMessage').style.display = 'none';
                }, 3000);
            }
        });

        // Logout
        function logout() {
            if (confirm('คุณต้องการออกจากระบบหรือไม่?')) {
                // Unsubscribe from Firestore listener
                if (unsubscribe) {
                    unsubscribe();
                }
                
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }

        // Load Data from Firestore
        function loadData() {
            const collectionName = systemConfig[currentSystem].collection;
            
            // Show loading
            document.getElementById('tableContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <p>กำลังโหลดข้อมูล...</p>
                </div>
            `;

            // Unsubscribe from previous listener
            if (unsubscribe) {
                unsubscribe();
            }

            // Real-time listener
            unsubscribe = db.collection(collectionName)
                .orderBy('timestamp', 'desc')  // desc = เรียงจากใหม่ไปเก่า (ล่าสุดก่อน)
                .onSnapshot((snapshot) => {
                    currentData = [];
                    
                    snapshot.forEach((doc) => {
                        currentData.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                    
                    updateStats(currentData);
                    renderTable(currentData);
                }, (error) => {
                    console.error('Error loading data:', error);
                    document.getElementById('tableContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">❌</div>
                            <p>เกิดข้อผิดพลาดในการโหลดข้อมูล: ${error.message}</p>
                        </div>
                    `;
                });
        }

        // Update Statistics
        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
        }

        // Render Table
        function renderTable(data) {
            const container = document.getElementById('tableContainer');
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>ไม่มีข้อมูล</p>
                    </div>
                `;
                return;
            }

            // Define table headers based on system
            let headers = '';
            if (currentSystem === 'certificate') {
                headers = `
                    <th>หมายเลขเอกสาร</th>
                    <th>เรื่อง</th>
                    <th>ผู้ลงนาม</th>
                    <th>จำนวน</th>
                    <th>ผู้ขอ</th>
                    <th>จัดการ</th>
                `;
            } else if (currentSystem === 'command') {
                headers = `
                    <th>หมายเลขเอกสาร</th>
                    <th>วันที่</th>
                    <th>เรื่อง</th>
                    <th>ผู้ขอ</th>
                    <th>จัดการ</th>
                `;
            } else {
                // documents, circulars, memos
                headers = `
                    <th>หมายเลขเอกสาร</th>
                    <th>วันที่</th>
                    <th>เรื่อง</th>
                    <th>จาก</th>
                    <th>ถึง</th>
                    <th>ผู้ขอ</th>
                    <th>จัดการ</th>
                `;
            }

            let html = `
                <table>
                    <thead>
                        <tr>${headers}</tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(item => {
                // Get document number
                const docNumber = item.documentNumber || item.memoNumber || item.commandNumber || item.certificateNumber || item.number || '-';
                
                // Get date
                let dateValue = '-';
                if (item.timestamp) {
                    if (item.timestamp.toDate) {
                        dateValue = item.timestamp.toDate();
                    } else {
                        dateValue = new Date(item.timestamp);
                    }
                }
                
                // Get other fields
                const title = item.title || item.subject || '-';
                const from = item.from || '-';
                const to = item.to || '-';
                const requester = item.requester || item.requestor || '-';
                const signer = item.signer || '-';
                const quantity = item.quantity || '-';
                
                // Build row based on system
                let row = '';
                if (currentSystem === 'certificate') {
                    row = `
                        <td><strong>${docNumber}</strong></td>
                        <td>${title}</td>
                        <td>${signer}</td>
                        <td>${quantity}</td>
                        <td>${requester}</td>
                    `;
                } else if (currentSystem === 'command') {
                    row = `
                        <td><strong>${docNumber}</strong></td>
                        <td>${formatDate(dateValue)}</td>
                        <td>${title}</td>
                        <td>${requester}</td>
                    `;
                } else {
                    row = `
                        <td><strong>${docNumber}</strong></td>
                        <td>${formatDate(dateValue)}</td>
                        <td>${title}</td>
                        <td>${from}</td>
                        <td>${to}</td>
                        <td>${requester}</td>
                    `;
                }
                
                html += `
                    <tr>
                        ${row}
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-primary btn-small" onclick="editData('${item.id}')">แก้ไข</button>
                                <button class="btn btn-danger btn-small" onclick="deleteData('${item.id}')">ลบ</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Format Date
        function formatDate(dateValue) {
            if (!dateValue || dateValue === '-') return '-';
            
            let date;
            if (dateValue instanceof Date) {
                date = dateValue;
            } else {
                date = new Date(dateValue);
            }
            
            if (isNaN(date.getTime())) return '-';
            
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 
                              'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${date.getDate()} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
        }

        // Search Data
        function searchData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = currentData.filter(item => {
                const docNumber = (item.documentNumber || item.memoNumber || item.commandNumber || item.certificateNumber || item.number || '').toString().toLowerCase();
                const subject = (item.subject || item.title || '').toString().toLowerCase();
                const requester = (item.requester || item.requestor || '').toString().toLowerCase();
                
                return docNumber.includes(searchTerm) ||
                       subject.includes(searchTerm) ||
                       requester.includes(searchTerm);
            });
            
            updateStats(filteredData);
            renderTable(filteredData);
        }

        // Open Add Modal
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'เพิ่มรายการใหม่';
            document.getElementById('dataForm').reset();
            
            // Hide date field for new records
            document.getElementById('dateFieldGroup').style.display = 'none';
            
            // Show/hide fields based on system
            showFormFieldsForSystem();
            
            document.getElementById('dataModal').style.display = 'flex';
        }

        // Show/hide form fields based on current system
        function showFormFieldsForSystem() {
            const fromToFields = document.getElementById('fromToFields');
            const certificateFields = document.getElementById('certificateFields');
            
            // Hide all optional fields first
            fromToFields.style.display = 'none';
            certificateFields.style.display = 'none';
            
            // Remove required attribute from all optional fields
            document.getElementById('signer').removeAttribute('required');
            document.getElementById('quantity').removeAttribute('required');
            
            // Show fields based on system
            if (currentSystem === 'certificate') {
                certificateFields.style.display = 'block';
                document.getElementById('signer').setAttribute('required', 'required');
                document.getElementById('quantity').setAttribute('required', 'required');
            } else if (currentSystem === 'documents' || currentSystem === 'circulars' || currentSystem === 'memos') {
                fromToFields.style.display = 'block';
            }
            // command system has only common fields (title, requester, notes)
        }

        // Edit Data
        function editData(id) {
            const item = currentData.find(d => d.id === id);
            if (!item) {
                alert('ไม่พบข้อมูล');
                return;
            }

            editingId = id;
            document.getElementById('modalTitle').textContent = 'แก้ไขรายการ';
            
            // Show date field for editing
            document.getElementById('dateFieldGroup').style.display = 'block';
            
            // Set timestamp value
            if (item.timestamp) {
                let dateValue;
                if (item.timestamp.toDate) {
                    dateValue = item.timestamp.toDate();
                } else {
                    dateValue = new Date(item.timestamp);
                }
                // Convert to datetime-local format (YYYY-MM-DDTHH:mm)
                const offset = dateValue.getTimezoneOffset();
                const localDate = new Date(dateValue.getTime() - (offset * 60 * 1000));
                const formattedDate = localDate.toISOString().slice(0, 16);
                document.getElementById('docTimestamp').value = formattedDate;
            }
            
            // Show/hide fields based on system
            showFormFieldsForSystem();
            
            // Set common values
            document.getElementById('title').value = item.title || item.subject || '';
            document.getElementById('requester').value = item.requester || item.requestor || '';
            document.getElementById('notes').value = item.notes || '';
            
            // Set system-specific values
            if (currentSystem === 'certificate') {
                document.getElementById('signer').value = item.signer || '';
                document.getElementById('quantity').value = item.quantity || '';
            } else if (currentSystem === 'documents' || currentSystem === 'circulars' || currentSystem === 'memos') {
                document.getElementById('from').value = item.from || '';
                document.getElementById('to').value = item.to || '';
            }
            
            document.getElementById('dataModal').style.display = 'flex';
        }

        // Save Data to Firestore
        async function saveData() {
            try {
                const collectionName = systemConfig[currentSystem].collection;
                
                // Common fields
                const formData = {
                    title: document.getElementById('title').value,
                    requester: document.getElementById('requester').value || '',
                    requestor: document.getElementById('requester').value || '', // Keep both spellings
                    notes: document.getElementById('notes').value || '',
                    year: new Date().getFullYear()
                };

                // Add system-specific fields
                if (currentSystem === 'certificate') {
                    formData.signer = document.getElementById('signer').value;
                    formData.quantity = parseInt(document.getElementById('quantity').value);
                } else if (currentSystem === 'documents' || currentSystem === 'circulars' || currentSystem === 'memos') {
                    formData.from = document.getElementById('from').value || '';
                    formData.to = document.getElementById('to').value || '';
                }

                if (editingId) {
                    // Update existing record
                    // อัพเดต timestamp ถ้ามีการแก้ไข (เพื่อให้สามารถปรับลำดับได้)
                    const timestampValue = document.getElementById('docTimestamp').value;
                    if (timestampValue) {
                        formData.timestamp = firebase.firestore.Timestamp.fromDate(new Date(timestampValue));
                    }
                    
                    await db.collection(collectionName).doc(editingId).update(formData);
                    alert('บันทึกข้อมูลสำเร็จ');
                } else {
                    // Add new record - เพิ่ม timestamp สำหรับรายการใหม่
                    formData.timestamp = firebase.firestore.Timestamp.fromDate(new Date());
                    await db.collection(collectionName).add(formData);
                    alert('เพิ่มข้อมูลสำเร็จ\n\nหมายเหตุ: หมายเลขเอกสารจะถูกสร้างโดยระบบหน้าบ้าน');
                }
                
                closeModal();
            } catch (error) {
                console.error('Error saving data:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message);
            }
        }

        // Delete Data from Firestore
        async function deleteData(id) {
            if (confirm('คุณต้องการลบรายการนี้หรือไม่?\n\nการดำเนินการนี้ไม่สามารถย้อนกลับได้')) {
                try {
                    const collectionName = systemConfig[currentSystem].collection;
                    await db.collection(collectionName).doc(id).delete();
                    alert('ลบข้อมูลสำเร็จ');
                } catch (error) {
                    console.error('Error deleting data:', error);
                    alert('เกิดข้อผิดพลาดในการลบข้อมูล: ' + error.message);
                }
            }
        }

        // Close Modal
        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
            document.getElementById('dataForm').reset();
            editingId = null;
        }

        // Switch System
        function switchSystem(system, event) {
            event.preventDefault();
            
            // Unsubscribe from previous listener
            if (unsubscribe) {
                unsubscribe();
            }
            
            currentSystem = system;
            
            // Update active menu
            document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
            event.target.closest('a').classList.add('active');
            
            // Update header
            document.getElementById('systemTitle').textContent = systemConfig[system].title;
            document.getElementById('systemDesc').textContent = systemConfig[system].desc;
            
            // Clear search
            document.getElementById('searchInput').value = '';
            
            loadData();
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('dataModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Download Excel Function
        function downloadExcel() {
            if (currentData.length === 0) {
                alert('ไม่มีข้อมูลให้ดาวน์โหลด');
                return;
            }

            // Prepare data for Excel based on system
            const excelData = currentData.map((item, index) => {
                // Get document number
                const docNumber = item.documentNumber || item.memoNumber || item.commandNumber || item.certificateNumber || item.number || '-';
                
                // Get date
                let dateValue = '-';
                if (item.timestamp) {
                    if (item.timestamp.toDate) {
                        dateValue = formatDateForExcel(item.timestamp.toDate());
                    } else {
                        dateValue = formatDateForExcel(new Date(item.timestamp));
                    }
                }
                
                // Common fields
                const title = item.title || item.subject || '-';
                const requester = item.requester || item.requestor || '-';
                const notes = item.notes || '-';
                const year = item.year || '-';

                // Build row based on system
                let row = {
                    'ลำดับ': index + 1,
                    'หมายเลขเอกสาร': docNumber,
                };

                if (currentSystem === 'certificate') {
                    row['เรื่อง'] = title;
                    row['ผู้ลงนาม'] = item.signer || '-';
                    row['จำนวน'] = item.quantity || '-';
                    row['ผู้ขอ'] = requester;
                    row['หมายเหตุ'] = notes;
                    row['ปี'] = year;
                } else if (currentSystem === 'command') {
                    row['วันที่'] = dateValue;
                    row['เรื่อง'] = title;
                    row['ผู้ขอ'] = requester;
                    row['หมายเหตุ'] = notes;
                    row['ปี'] = year;
                } else {
                    // documents, circulars, memos
                    row['วันที่'] = dateValue;
                    row['เรื่อง'] = title;
                    row['จาก'] = item.from || '-';
                    row['ถึง'] = item.to || '-';
                    row['ผู้ขอ'] = requester;
                    row['หมายเหตุ'] = notes;
                    row['ปี'] = year;
                }

                return row;
            });

            // Create workbook and worksheet
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(excelData);

            // Set column widths based on system
            let colWidths;
            if (currentSystem === 'certificate') {
                colWidths = [
                    { wch: 8 },  // ลำดับ
                    { wch: 20 }, // หมายเลขเอกสาร
                    { wch: 40 }, // เรื่อง
                    { wch: 20 }, // ผู้ลงนาม
                    { wch: 10 }, // จำนวน
                    { wch: 20 }, // ผู้ขอ
                    { wch: 30 }, // หมายเหตุ
                    { wch: 8 }   // ปี
                ];
            } else if (currentSystem === 'command') {
                colWidths = [
                    { wch: 8 },  // ลำดับ
                    { wch: 20 }, // หมายเลขเอกสาร
                    { wch: 15 }, // วันที่
                    { wch: 40 }, // เรื่อง
                    { wch: 20 }, // ผู้ขอ
                    { wch: 30 }, // หมายเหตุ
                    { wch: 8 }   // ปี
                ];
            } else {
                colWidths = [
                    { wch: 8 },  // ลำดับ
                    { wch: 20 }, // หมายเลขเอกสาร
                    { wch: 15 }, // วันที่
                    { wch: 40 }, // เรื่อง
                    { wch: 30 }, // จาก
                    { wch: 30 }, // ถึง
                    { wch: 20 }, // ผู้ขอ
                    { wch: 30 }, // หมายเหตุ
                    { wch: 8 }   // ปี
                ];
            }
            ws['!cols'] = colWidths;

            // Add worksheet to workbook
            const systemName = systemConfig[currentSystem].title;
            XLSX.utils.book_append_sheet(wb, ws, systemName);

            // Generate filename with current date
            const now = new Date();
            const dateStr = `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear() + 543}`;
            const filename = `${systemName}_${dateStr}.xlsx`;

            // Download file
            XLSX.writeFile(wb, filename);
        }

        // Format date for Excel
        function formatDateForExcel(dateValue) {
            if (!dateValue) return '-';
            
            let date;
            if (dateValue instanceof Date) {
                date = dateValue;
            } else {
                date = new Date(dateValue);
            }
            
            if (isNaN(date.getTime())) return '-';
            
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear() + 543;
            
            return `${day}/${month}/${year}`;
        }

        // Initialize
        console.log('Firebase Admin Panel Ready - Connected to Firestore');
    </script>
</body>
